<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Find Saudi Ministry of Health on-duty health centers open now, by region, with directions.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MOH On-Duty Health Centers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a find-a-clinic site — live status band, region tiles as the map, filter bar, then a grid of center cards. */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --fg:#13201c; --muted:#5a6a64; --line:#dbe4e0;
  --accent:#0b6a55; --accent-ink:#ffffff; --accent-soft:#e0f0ea;
  --open:#0f7a46; --open-bg:#dcf2e6; --closed:#a33b2b; --closed-bg:#f8e3df; --unk:#8a6512; --unk-bg:#f6ecd4;
  --s24:#0b6a55; --s24-bg:#dcefe8; --wk:#2e5c89; --wk-bg:#e2ebf5; --ext:#8a5a12; --ext-bg:#f6ebd6; --odd:#7a3e74; --odd-bg:#f2e5f0;
  --band:#0e2a23; --band-fg:#e6f2ee; --band-muted:#9fbfb4;
  --f-ui:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --fg:#e3ebe7; --muted:#92a29b; --line:#25312c;
  --accent:#4cc39f; --accent-ink:#0b1c17; --accent-soft:#17302a;
  --open:#5fd394; --open-bg:#15301f; --closed:#f0927f; --closed-bg:#3a1c17; --unk:#e6b75e; --unk-bg:#33280f;
  --s24:#6fd6b5; --s24-bg:#173229; --wk:#8fb8e3; --wk-bg:#18273a; --ext:#e7b46a; --ext-bg:#33270f; --odd:#d9a2d1; --odd-bg:#2e1c2c;
  --band:#0a1f19; --band-fg:#e3f0eb; --band-muted:#8fb3a6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --fg:#e3ebe7; --muted:#92a29b; --line:#25312c;
  --accent:#4cc39f; --accent-ink:#0b1c17; --accent-soft:#17302a;
  --open:#5fd394; --open-bg:#15301f; --closed:#f0927f; --closed-bg:#3a1c17; --unk:#e6b75e; --unk-bg:#33280f;
  --s24:#6fd6b5; --s24-bg:#173229; --wk:#8fb8e3; --wk-bg:#18273a; --ext:#e7b46a; --ext-bg:#33270f; --odd:#d9a2d1; --odd-bg:#2e1c2c;
  --band:#0a1f19; --band-fg:#e3f0eb; --band-muted:#8fb3a6; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
html[lang="ar"] body{font-family:var(--f-ar)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero band */
.hero{background:var(--band);color:var(--band-fg)}
.hero .in{padding-block:28px 26px;display:grid;gap:22px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:end}
@media (max-width:760px){.hero .in{grid-template-columns:minmax(0,1fr)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;grid-column:1/-1}
.brand{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--band-muted);font-weight:600}
html[lang="ar"] .brand{letter-spacing:0}
.lang{border:1px solid var(--band-muted);background:transparent;color:var(--band-fg);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600}
h1{margin:0;font-size:clamp(1.8rem,4.5vw,2.8rem);line-height:1.1;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
html[lang="ar"] h1{letter-spacing:0}
.lede{margin:.6rem 0 0;color:var(--band-muted);max-width:52ch}
.clock{border-inline-start:2px solid var(--accent);padding-inline-start:16px}
.clock .t{font-family:var(--f-mono);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.clock .d{color:var(--band-muted);font-size:.9rem}
.clock .n{margin-top:10px;font-size:1rem}
.clock .n b{color:var(--open);font-size:1.3rem;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .clock .n b{color:#6fe0a6}}
:root[data-theme="light"] .clock .n b{color:#6fe0a6}

/* regions */
section{padding-block:22px 0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sh h2{margin:0;font-size:1.05rem;font-weight:600}
.sh small{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile .nm{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.tile .ct{display:flex;justify-content:space-between;font-size:.8rem;opacity:.85;font-variant-numeric:tabular-nums}
.mix{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--line)}
.mix i{display:block;height:100%}
.tile[aria-pressed="true"] .mix{outline:1px solid var(--accent-ink)}

/* filter bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:22px}
.bar .in{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:12px}
.search{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.88rem;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.live[aria-pressed="true"]{background:var(--open);border-color:var(--open);color:var(--surface)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--open);margin-inline-end:6px;vertical-align:middle}
.chip.live[aria-pressed="true"] .dot{background:var(--surface)}
select.chip{appearance:auto}
.result{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:16px 10px;color:var(--muted)}
.result b{color:var(--fg);font-variant-numeric:tabular-nums}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.85rem}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding-bottom:28px}
@media (max-width:400px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.st{font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st.o{color:var(--open);background:var(--open-bg)} .st.c{color:var(--closed);background:var(--closed-bg)} .st.u{color:var(--unk);background:var(--unk-bg)}
.where{font-size:.8rem;color:var(--muted)}
.name{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:1.08rem;font-weight:600;line-height:1.35;margin:0}
.meta{font-size:.82rem;color:var(--muted);font-family:var(--f-ar)}
.pill{display:inline-block;border-radius:6px;padding:3px 8px;font-size:.8rem;font-weight:600}
.pD{color:var(--s24);background:var(--s24-bg)} .pB{color:var(--wk);background:var(--wk-bg)}
.pC{color:var(--ext);background:var(--ext-bg)} .pA{color:var(--muted);background:var(--bg);border:1px solid var(--line)}
.pX{color:var(--odd);background:var(--odd-bg)}
.next{font-size:.82rem;color:var(--muted)}
.note{font-size:.8rem;color:var(--unk);background:var(--unk-bg);border-radius:6px;padding:6px 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 12px;font-weight:600;font-size:.86rem;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.off{opacity:.55;cursor:default}
.empty{grid-column:1/-1;padding:48px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
footer .in{padding-block:18px 32px;display:grid;gap:6px;max-width:1200px}
footer a{color:var(--accent)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.88rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
</style>

</head>
<body>
<div class="hero">
  <div class="in">
    <div class="top">
      <span class="brand" data-t="brand"></span>
      <button class="lang" id="lang" type="button"></button>
    </div>
    <div>
      <h1 data-t="h1"></h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="clock" aria-live="polite">
      <div class="t" id="clk"></div>
      <div class="d" id="day"></div>
      <div class="n" id="opennow"></div>
    </div>
  </div>
</div>

<section class="in" aria-labelledby="rh">
  <div class="sh"><h2 id="rh" data-t="regions"></h2><small data-t="tapRegion"></small></div>
  <div class="tiles" id="tiles"></div>
</section>

<div class="bar">
  <div class="in">
    <input class="search" id="q" type="search" autocomplete="off">
    <button class="chip live" id="live" type="button" aria-pressed="false"><span class="dot"></span><span data-t="openNow"></span></button>
    <button class="chip" id="h24" type="button" aria-pressed="false" data-t="only24"></button>
    <select class="chip" id="sched" aria-label="Hours"></select>
    <select class="chip" id="sort" aria-label="Sort"></select>
  </div>
</div>

<main class="in">
  <div class="result">
    <span id="res"></span>
    <span style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="ghost" id="reset" type="button" data-t="reset"></button>
      <button class="ghost" id="copy" type="button" data-t="copy"></button>
    </span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="in">
  <span data-t="foot1"></span>
  <span data-t="foot2"></span>
  <span><span data-t="src"></span> <a href="https://www.moh.gov.sa/HealthAwareness/On-Duty-Healthcare-Centers/Pages/default.aspx" target="_blank" rel="noopener">moh.gov.sa</a> · <span data-t="emerg"></span></span>
</div></footer>
<div class="toast" id="toast" hidden></div>

  dir:"Directions",noMap:"No map link",alt:"Alt. map",copyName:"Copy name",
  empty:"No centers match. Clear the search or choose another region.",copied:n=>`Copied ${n} rows`,copiedName:"Name copied",
  foot1:"Rows follow each MOH regional page as published. Bisha repeats Asir centers, Al-Qunfudhah repeats Makkah, and Al-Qurayyat repeats Al-Jouf.",
  foot2:"Hours were read from merged-cell tables on the source pages. Confirm a center's hours on its regional page before relying on them.",
  src:"Source, extracted 19 Oct 2026:",emerg:"For emergencies call 997 (Red Crescent).",today:"today",tomorrow:"tomorrow",
  days:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],ds:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
  sunThu:"Sun–Thu",friSat:"Fri–Sat",every:"Every day",h24:"24 hours",
  sched:{A:"8 AM–11 PM, Sun–Thu",B:"24 hours, Sun–Thu",C:"8 AM–11 PM, every day",D:"24 hours, every day",X:"Other hours"}},
 ar:{brand:"وزارة الصحة السعودية · دليل",h1:"ابحث عن مركز صحي مناوب",
  lede:"٣٦٤ مركز رعاية أولية تعمل خارج أوقات الدوام الرسمي في ٢٠ قائمة إقليمية. تُحسب الحالة مباشرة بتوقيت الرياض.",
  regions:"المناطق",tapRegion:"اختر منطقة للتصفية",all:"كل المناطق",openNow:"مفتوح الآن",only24:"٢٤ ساعة فقط",
  search:"ابحث باسم المركز أو المدينة أو الحي",reset:"مسح التصفية",copy:"نسخ إلى إكسل",
  anyHours:"كل الأوقات",sortRegion:"الترتيب: حسب المنطقة",sortOpen:"الترتيب: المفتوح أولًا",sortName:"الترتيب: الاسم",
  showing:(n,t)=>`<b>${n}</b> من ${t} مركزًا`,openCount:n=>`<b>${n}</b> مركزًا مفتوحًا الآن`,
  open:"مفتوح",closed:"مغلق",unknown:"الأوقات غير واضحة",closes:x=>`يغلق ${x}`,opens:x=>`يفتح ${x}`,always:"يعمل على مدار الساعة",
  dir:"الاتجاهات",noMap:"لا يوجد رابط خريطة",alt:"رابط بديل",copyName:"نسخ الاسم",
  empty:"لا توجد مراكز مطابقة. امسح البحث أو اختر منطقة أخرى.",copied:n=>`تم نسخ ${n} صفًا`,copiedName:"تم نسخ الاسم",
  foot1:"الصفوف كما وردت في صفحات الوزارة. قائمة بيشة تكرر مراكز عسير، والقنفذة تكرر مكة، والقريات تكرر الجوف.",
  foot2:"قُرئت الأوقات من جداول بخلايا مدمجة في المصدر، فتأكد من أوقات المركز في صفحة منطقته قبل الاعتماد عليها.",
  src:"المصدر، تاريخ الاستخراج ١٩ أكتوبر ٢٠٢٦:",emerg:"للطوارئ اتصل على ٩٩٧ (الهلال الأحمر).",today:"اليوم",tomorrow:"غدًا",
  days:["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],ds:["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],
  sunThu:"الأحد–الخميس",friSat:"الجمعة–السبت",every:"يوميًا",h24:"٢٤ ساعة",
  sched:{A:"٨ص–١١م، الأحد–الخميس",B:"٢٤ ساعة، الأحد–الخميس",C:"٨ص–١١م، يوميًا",D:"٢٤ ساعة، يوميًا",X:"أوقات أخرى"}}
};
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const code = r => "ABCD".includes(r.sched) && r.sched.length===1 ? r.sched : "X";
let lang = "en";
try{ lang = localStorage.getItem("odc-lang") || "en"; }catch(e){}
const st = {region:"", q:"", live:false, h24:false, sched:"", sort:"region"};

/* ---- Riyadh time ---- */
function riyadh(){ const d=new Date(Date.now()+3*3600e3); return {day:d.getUTCDay(), h:d.getUTCHours()+d.getUTCMinutes()/60, d}; }
function openAt(spec, day, h){
  for(const [days,s,e] of spec){
    if(days.includes(day) && h>=s && h<Math.min(e,24)) return true;
    if(e>24 && days.includes((day+6)%7) && h<e-24) return true;
  }
  return false;
}
function status(r){
  if(!r.spec) return {k:"u"};
  const {day,h}=riyadh();
  const now=openAt(r.spec,day,h);
  // step forward in 30-minute increments to find the next change
  let dd=day, hh=h;
  for(let i=1;i<=7*48;i++){
    hh+=.5; if(hh>=24){hh-=24;dd=(dd+1)%7;}
    const slot=Math.floor(hh*2)/2;
    if(openAt(r.spec,dd,slot)!==now) return {k:now?"o":"c", at:[dd,slot], same:dd===day, next:dd===(day+1)%7};
  }
  return {k:now?"o":"c", always:now};
}
function fmtH(x){
  const H=Math.floor(x)%24, m=Math.round((x%1)*60);
  if(lang==="ar"){ const p=H<12?"ص":"م"; const h12=H%12||12; return `${h12}${m?":"+String(m).padStart(2,"0"):""} ${p}`; }
  const p=H<12?"AM":"PM"; const h12=H%12||12; return `${h12}${m?":"+String(m).padStart(2,"0"):""} ${p}`;
}
function whenTxt(s){
  const L=T[lang]; const day = s.same? "" : s.next? " "+L.tomorrow : " "+L.ds[s.at[0]];
  return fmtH(s.at[1])+day;
}
function hoursLabel(r){
  const L=T[lang];
  if(!r.spec) return lang==="ar" ? "غير مؤكد" : r.sched;
  const c=code(r); if(c!=="X") return L.sched[c];
  return r.spec.map(([days,s,e])=>{
    const dn = days.length===7?L.every: days.length===5?L.sunThu: L.friSat;
    const tm = (s===0&&e===24)?L.h24:`${fmtH(s)}–${fmtH(e)}`;
    return `${tm}, ${dn}`; }).join(" · ");
}

/* ---- render ---- */
const regions=[...new Map(DATA.map(r=>[r.region,r.region_ar])).entries()];
function applyLang(){
  const L=T[lang];
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=L[el.dataset.t]);
  $("lang").textContent = lang==="ar"?"English":"العربية";
  $("q").placeholder=L.search;
  $("sched").innerHTML = `<option value="">${L.anyHours}</option>`+["D","B","C","A","X"].map(k=>`<option value="${k}">${L.sched[k]}</option>`).join("");
  $("sched").value=st.sched;
  $("sort").innerHTML = `<option value="region">${L.sortRegion}</option><option value="open">${L.sortOpen}</option><option value="name">${L.sortName}</option>`;
  $("sort").value=st.sort;
  renderTiles(); tick(); render();
}
function mixBar(rows){
  const n=rows.length||1, c={D:0,B:0,C:0,A:0,X:0}; rows.forEach(r=>c[code(r)]++);
  const col={D:"var(--s24)",B:"var(--wk)",C:"var(--ext)",A:"var(--muted)",X:"var(--odd)"};
  return `<span class="mix" aria-hidden="true">${Object.keys(c).map(k=>c[k]?`<i style="width:${c[k]/n*100}%;background:${col[k]}"></i>`:"").join("")}</span>`;
}
function renderTiles(){
  const L=T[lang];
  const tile=(key,name,rows)=>{
    const open=rows.filter(r=>status(r).k==="o").length;
    return `<button class="tile" type="button" data-r="${esc(key)}" aria-pressed="${st.region===key}">
      <span class="nm">${esc(name)}</span>
      <span class="ct"><span>${rows.length}</span><span>${open} ${L.open.toLowerCase()}</span></span>${mixBar(rows)}</button>`;
  };
  $("tiles").innerHTML = tile("",L.all,DATA) + regions.map(([en,ar])=>tile(en, lang==="ar"?ar:en, DATA.filter(r=>r.region===en))).join("");
}
function filtered(){
  const q=st.q.trim().toLowerCase();
  let v=DATA.filter(r=>
    (!st.region||r.region===st.region) &&
    (!st.sched||code(r)===st.sched) &&
    (!st.h24||r.sched==="D") &&
    (!st.live||status(r).k==="o") &&
    (!q||[r.name,r.region,r.region_ar,r.cluster,r.area,r.sched].join(" ").toLowerCase().includes(q)));
  if(st.sort==="open"){ const o={o:0,u:1,c:2}; v=[...v].sort((a,b)=>o[status(a).k]-o[status(b).k]); }
  if(st.sort==="name"){ v=[...v].sort((a,b)=>a.name.localeCompare(b.name,"ar")); }
  return v;
}
let view=[];
function render(){
  const L=T[lang]; view=filtered();
  $("res").innerHTML=L.showing(view.length,DATA.length);
  if(!view.length){ $("grid").innerHTML=`<div class="empty">${L.empty}</div>`; return; }
  $("grid").innerHTML=view.map((r,i)=>{
    const s=status(r), c=code(r);
    const badge = s.k==="o"?`<span class="st o">● ${L.open}</span>`: s.k==="c"?`<span class="st c">${L.closed}</span>`:`<span class="st u">${L.unknown}</span>`;
    const next = s.k==="u"?"": s.always?L.always: s.k==="o"?L.closes(whenTxt(s)):L.opens(whenTxt(s));
    const where=[lang==="ar"?r.region_ar:r.region, r.area==="Riyadh city"?(lang==="ar"?"داخل المدينة":"City"):r.area==="Governorates"?(lang==="ar"?"المحافظات":"Governorates"):""].filter(Boolean).join(" · ");
    const acts = (r.link?`<a class="btn go" href="${esc(r.link)}" target="_blank" rel="noopener">${L.dir} ↗</a>`:`<span class="btn off">${L.noMap}</span>`)
      + r.alt.map(u=>`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${L.alt}</a>`).join("")
      + `<button class="btn" type="button" data-copy="${i}">${L.copyName}</button>`;
    return `<article class="card">
      <div class="row"><span class="where">${esc(where)}</span>${badge}</div>
      <h3 class="name" dir="rtl">${esc(r.name)}</h3>
      ${r.cluster?`<div class="meta" dir="rtl">${esc(r.cluster)}</div>`:""}
      <div class="row"><span class="pill p${c}">${esc(hoursLabel(r))}</span><span class="next">${esc(next)}</span></div>
      ${r.note?`<div class="note">${esc(r.note)}</div>`:""}
      <div class="acts">${acts}</div></article>`;
  }).join("");
}
function tick(){
  const L=T[lang], {d,day}=riyadh();
  $("clk").textContent=`${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`;
  $("day").textContent=`${L.days[day]} · ${lang==="ar"?"توقيت الرياض":"Riyadh time"}`;
  $("opennow").innerHTML=L.openCount(DATA.filter(r=>status(r).k==="o").length);
}

/* ---- events ---- */
$("tiles").addEventListener("click",e=>{const b=e.target.closest(".tile"); if(!b) return; st.region=b.dataset.r; renderTiles(); render(); document.querySelector(".bar").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});});
$("q").addEventListener("input",e=>{st.q=e.target.value;render();});
$("sched").addEventListener("change",e=>{st.sched=e.target.value;render();});
$("sort").addEventListener("change",e=>{st.sort=e.target.value;render();});
$("live").addEventListener("click",()=>{st.live=!st.live;$("live").setAttribute("aria-pressed",st.live);render();});
$("h24").addEventListener("click",()=>{st.h24=!st.h24;$("h24").setAttribute("aria-pressed",st.h24);render();});
$("reset").addEventListener("click",()=>{Object.assign(st,{region:"",q:"",live:false,h24:false,sched:""});$("q").value="";$("sched").value="";$("live").setAttribute("aria-pressed","false");$("h24").setAttribute("aria-pressed","false");renderTiles();render();});
$("lang").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("odc-lang",lang);}catch(e){} applyLang();});

function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2000);}
function copyText(txt,msg){
  const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(msg);}catch(e){}ta.remove();};
  try{navigator.clipboard.writeText(txt).then(()=>toast(msg),fb);}catch(e){fb();}
}
$("grid").addEventListener("click",e=>{const b=e.target.closest("[data-copy]"); if(b) copyText(view[+b.dataset.copy].name,T[lang].copiedName);});
$("copy").addEventListener("click",()=>{
  const head=["Region","Region (Arabic)","Area","Cluster","No.","Health center","Hours","Status now","Map link","Other links","Note","Source page"];
  const cl=s=>String(s??"").replace(/[\t\n]/g," ");
  const sk={o:"Open",c:"Closed",u:"Unclear"};
  const tsv=[head.join("\t")].concat(view.map(r=>[r.region,r.region_ar,r.area,r.cluster,r.no,r.name,r.sched.length===1?T.en.sched[r.sched]:r.sched,sk[status(r).k],r.link,r.alt.join(" "),r.note,r.source].map(cl).join("\t"))).join("\n");
  copyText(tsv,T[lang].copied(view.length));
});

applyLang();
setInterval(()=>{tick(); renderTiles(); render();},60000);
</script>
